  }
  .agente .cab .status { flex: none; align-self: center; padding: 3px 8px; border-radius: 999px; }
  .agente .cab .status.s-ativo { background: rgba(52, 211, 153, .12); }
  .agente .cab .status.s-ativo::after { left: 8px; }
  .agente .meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11px; color: var(--faint); }
  .agente .meta span { white-space: nowrap; }
  /* Item "modelo" como botão: mesma tipografia da linha e alvo de toque de
     --toque-min; a margem negativa devolve à linha a altura do texto, e o
     z-index põe o alvo por cima da linha de baixo quando a .meta quebra. */
  .modelo-btn {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
    min-width: 0;
    min-height: var(--toque-min);
    margin-block: calc((1lh - var(--toque-min)) / 2);
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .modelo-btn b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modelo-btn svg { flex: none; color: var(--muted); }
  .modelo-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .modelo-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
  .modelos-ag {
    list-style: none;
    margin: 0;
    padding: 6px 8px;
    border-radius: 8px;
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
  }
  .modelos-ag li { display: flex; justify-content: space-between; gap: 8px; }
  .modelos-ag span { min-width: 0; font-family: var(--mono); color: var(--text); overflow-wrap: anywhere; }
  .modelos-ag b { flex: none; font-family: var(--mono); font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .agente .meta b { font-family: var(--mono); font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
  .vazio-det { color: var(--muted); margin: 0; }

  /* A partir de 600 px os tiles crescem para 200 px. */
  @media (min-width: 600px) {
    :root { --tile-w: 200px; }
    #grade { gap: 14px; }
    .tela { padding-top: 32px; }
    header {
      padding: 20px 32px;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
      grid-template-areas: "marca contador . push som vivo";
      gap: 20px;
    }
  }

  /* Celular: o pop-up vira uma folha que sobe do rodapé e rola por dentro. */
  @media (max-width: 599px) {
    #detalhe {
      width: 100%;
      max-width: 100%;
      max-height: 90dvh;
      margin: auto 0 0;
      border-width: 1px 0 0;
      border-radius: 20px 20px 0 0;
    }
    .alca {
      display: block;
      flex: none;
      width: 36px;
      height: 4px;
      margin: 10px auto 0;
      border-radius: 2px;
      background: var(--border);
    }
    .det-topo { padding-top: 10px; }
    .metrica .v { font-size: 13px; }
    /* Sem espaço para três ações com rótulo: silenciar fica só com o ícone
       (o aria-label e o title seguem dizendo o que ele faz). */
    #det-silenciar { width: 32px; padding: 0; justify-content: center; }
    #det-silenciar span { display: none; }
  }

  /* Celular na horizontal: a tela é baixa demais para o cabeçalho, então só
     os tiles ficam. Ele volta enquanto a conexão estiver caída, para o aviso
     de "reconectando…" não sumir. pointer: coarse deixa de fora janelas
     baixas no desktop. */
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    header:not(.reconectando) { display: none; }
    .tela { padding-top: 12px; padding-bottom: 12px; gap: 12px; }
    #pontos { margin-bottom: 4px; }
    #tela-uso h2 { display: none; }
    .uso-conta { padding: 12px 14px; gap: 10px; }
    .med-pct { font-size: 24px; }
  }

  /* Sem animação para quem pediu menos movimento: o anel fica fixo. */
  @media (prefers-reduced-motion: reduce) {
    .status.s-ativo::after { animation: none; box-shadow: 0 0 0 3px rgba(52, 211, 153, .25); }
    .tile { transition: none; }
    .tile:active { transform: none; }
    header { transition: none; }
    :root { --tela-transicao: 0s; }
  }
</style>
</head>
<body>
<header id="topo" class="reconectando">
  <div class="marca">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="1" y="1" width="9" height="9" rx="2.5" fill="#34d399"/>
      <rect x="12" y="1" width="9" height="9" rx="2.5" fill="#fbbf24"/>
      <rect x="1" y="12" width="9" height="9" rx="2.5" fill="#8b93a1"/>
      <rect x="12.75" y="12.75" width="7.5" height="7.5" rx="2" fill="none" stroke="#a0a7b4" stroke-width="1.5" stroke-dasharray="2 2"/>
    </svg>
    <h1>Claude Fleet</h1>
  </div>
  <div class="resumo">
    <div id="contador"><span class="chip">conectando…</span></div>
    <label class="chip filtro-conta" id="filtro-conta-rotulo" hidden>conta
      <select id="filtro-conta" aria-label="Filtrar a grade por conta"></select>
    </label>
  </div>
  <button type="button" id="push" aria-pressed="false" aria-label="Notificações neste aparelho" hidden></button>
  <button type="button" id="som" aria-pressed="false" aria-label="Som dos alertas" hidden></button>
  <p id="conexao" role="status">conectando…</p>
</header>
<div id="telas">
  <section id="tela-sessoes" class="tela" aria-label="Sessões">
    <div id="grade" aria-live="polite"></div>
    <p id="vazio" hidden>Nenhuma sessão no momento.</p>
    <p class="nota">Custos estimados pelo preço de lista da API.</p>
  </section>
  <section id="tela-uso" class="tela" aria-labelledby="uso-titulo" inert>
    <h2 id="uso-titulo">Uso do plano</h2>
    <div id="uso-contas" class="uma"></div>
  </section>
</div>
<nav id="pontos" aria-label="Telas">
  <button type="button" data-tela="sessoes" aria-label="Sessões" aria-current="true"></button>
  <button type="button" data-tela="uso" aria-label="Uso do plano" aria-current="false"></button>
</nav>
<dialog id="detalhe" aria-labelledby="det-titulo">
  <div class="det">
    <div class="alca" aria-hidden="true"></div>
    <div class="det-topo">
      <div class="linha">
        <div class="det-estado" id="det-estado"></div>
        <div class="det-acoes">
          <button type="button" class="ocultar" id="det-silenciar" hidden></button>
          <button type="button" class="ocultar" id="det-ocultar" hidden></button>
          <button type="button" class="fechar" id="det-fechar" aria-label="Fechar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <h2 id="det-titulo">Sessão</h2>
      <div class="det-sub" id="det-sub"></div>
    </div>
    <div class="det-corpo" id="det-corpo"></div>
    <div class="det-rodape" id="det-rodape"></div>
  </div>
</dialog>
<script>
'use strict';

// Rótulos exibidos para cada status vindo do Store.
const ROTULO = {
  ativo: 'ativo',
  aguardando: 'aguardando',
  parado: 'parado',
  encerrado: 'encerrado',
  desconhecido: 'desconhecido',
  concluido: 'concluído',
};

// Ordem dos grupos na grade: o que pede atenção vem primeiro.
const ORDEM = { aguardando: 0, ativo: 1, parado: 2, desconhecido: 3, encerrado: 4 };

const topo = document.getElementById('topo');
const grade = document.getElementById('grade');
const vazio = document.getElementById('vazio');
const contador = document.getElementById('contador');
const conexao = document.getElementById('conexao');

const moeda = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Ícones SVG inline. Montados com createElementNS: nada de innerHTML.
const SVG_NS = 'http://www.w3.org/2000/svg';
const ICONES = {
  ferramenta: { size: 12, paths: [{ d: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z', stroke: 'currentColor', w: 2 }] },
  check: { size: 10, paths: [{ d: 'M5 12.5l4.5 4.5L19 7.5', stroke: 'currentColor', w: 3 }] },
  alerta: { size: 11, paths: [{ d: 'M12 3l10 18H2z', fill: 'currentColor' }, { d: 'M12 10v5M12 18v.5', stroke: 'var(--icone-interno, var(--aguardando-bg))', w: 2.4 }] },
  somLigado: { size: 16, paths: [{ d: 'M4 9.5h3.5L12 5.5v13l-4.5-4H4z', fill: 'currentColor' }, { d: 'M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11', stroke: 'currentColor', w: 2 }] },
  somDesligado: { size: 16, paths: [{ d: 'M4 9.5h3.5L12 5.5v13l-4.5-4H4z', fill: 'currentColor' }, { d: 'M16 9.5l5 5M21 9.5l-5 5', stroke: 'currentColor', w: 2 }] },
  sino: { size: 16, paths: [{ d: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z', fill: 'currentColor' }, { d: 'M10 20.5a2 2 0 0 0 4 0', stroke: 'currentColor', w: 2 }] },
  sinoCortado: { size: 16, paths: [{ d: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z', fill: 'currentColor' }, { d: 'M10 20.5a2 2 0 0 0 4 0', stroke: 'currentColor', w: 2 }, { d: 'M3.5 3.5l17 17', stroke: 'var(--surface-2)', w: 4 }, { d: 'M3.5 3.5l17 17', stroke: 'currentColor', w: 2 }] },
  olhoCortado: { size: 13, paths: [{ d: 'M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a12 12 0 0 1-3 4.2M6.6 6.6C4.3 8 2.7 10.2 2 12c1 2.5 5 7 10 7a10 10 0 0 0 4.4-1M9.9 9.9a3 3 0 0 0 4.2 4.2', stroke: 'currentColor', w: 2 }] },
  olho: { size: 13, paths: [{ d: 'M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z', stroke: 'currentColor', w: 2 }, { d: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', stroke: 'currentColor', w: 2 }] },
  seta: { size: 10, paths: [{ d: 'M6 9l6 6 6-6', stroke: 'currentColor', w: 2.4 }] },
  aviso: { size: 11, paths: [{ d: 'M12 3l10 18H2z', fill: 'var(--parado)' }, { d: 'M12 10v5M12 18v.5', stroke: 'var(--surface)', w: 2.4 }] },
};

function icone(nome, tamanho) {
  const def = ICONES[nome];
  const s = tamanho || def.size;
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', s);
  svg.setAttribute('height', s);
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('aria-hidden', 'true');
  for (const p of def.paths) {
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', p.d);
    // style, e não atributo: atributos de apresentação não resolvem var().
    if (p.fill) path.style.fill = p.fill;
    if (p.stroke) {
      path.style.stroke = p.stroke;
      path.setAttribute('stroke-width', p.w);
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
    }
    svg.append(path);
  }
  return svg;
}

// subAguardando informa se algum subagente da sessão espera permissão.
function subAguardando(s) {
  return (s.Subagents || []).some((a) => a.Status === 'aguardando');
}

// precisaAtencao: sessão aguardando ou com subagente aguardando.
function precisaAtencao(s) {
  return s.Status === 'aguardando' || subAguardando(s);
}

// formatarCusto resume Total: "US$ 0,12", "n/d" ou "≥ US$ X".
function formatarCusto(total) {
  const usd = (total && total.CostUSD) || 0;
  const conhecido = !!(total && total.CostKnown);
  const valor = usd > 0 && usd < 0.005 ? '< US$ 0,01' : 'US$ ' + moeda.format(usd);
  if (conhecido) return valor;
  if (usd <= 0) return 'n/d';
  return '≥ US$ ' + moeda.format(usd);
}

// Ordenação estável: grupo de status, depois StartedAt, depois ID.
function ordenar(sessoes) {
  const grupo = (s) => (precisaAtencao(s) ? 0 : (ORDEM[s.Status] ?? 3));
  return sessoes.slice().sort((a, b) =>
    grupo(a) - grupo(b) ||
    (Date.parse(a.StartedAt) || 0) - (Date.parse(b.StartedAt) || 0) ||
    (a.ID < b.ID ? -1 : a.ID > b.ID ? 1 : 0));
}

// el cria um elemento com classe e texto. Texto sempre via textContent.
function el(tag, classe, texto) {
  const n = document.createElement(tag);
  if (classe) n.className = classe;
  if (texto != null) n.textContent = texto;
  return n;
}

function statusSpan(st) {
  const s = ROTULO[st] ? st : 'desconhecido';
  return el('span', 'status s-' + s, ROTULO[s]);
}

function avisoSub(texto) {
  const n = el('div', 'aviso-sub');
  n.append(icone('alerta'), el('span', null, texto));
  return n;
}

// miniTile: ativos e aguardando um a um; concluídos entram agrupados.
function miniTile(a, sessaoId) {
  const st = ROTULO[a.Status] ? a.Status : 'desconhecido';
  const tipo = a.Type || 'subagente';
  const rotulo = a.Description || tipo;
  const mini = el('span', 'sub s-' + st);
  mini.dataset.agent = a.ID;
  mini.title = (a.Description ? a.Description + ' · ' : '') + tipo + ' · ' + ROTULO[st] + (a.LastTool ? ' · ' + a.LastTool : '');
  const mudo = silenciados.has(sessaoId + '/' + a.ID);
  if (mudo) mini.title += ' · alerta silenciado';
  if (st === 'aguardando') mini.append(icone('alerta', 10));
  if (mudo) mini.append(icone('somDesligado', 10));
  mini.append(el('span', 'tipo', rotulo));
  return mini;
}

function montarTile(s, oculta) {
  const status = ROTULO[s.Status] ? s.Status : 'desconhecido';
  const subs = s.Subagents || [];
  const subAg = subAguardando(s);
  const tile = el('div', 'tile s-' + status);
  tile.dataset.id = s.ID;
  tile.tabIndex = 0;
  tile.setAttribute('role', 'button');
  if (subAg) tile.classList.add('sub-aguardando');

  const nome = s.Name || s.Project || s.ShortID || s.ID;
  tile.title = s.Cwd || nome;

  const mudo = silenciados.has(s.ID);
  if (oculta) tile.classList.add('oculta');
  if (oculta || mudo) {
    const marcas = el('span', 'marcas');
    if (mudo) {
      const m = el('span', 'marca-silenciada');
      m.title = 'alerta silenciado nesta espera';
      m.append(icone('somDesligado', 13));
      marcas.append(m);
    }
    if (oculta) {
      const m = el('span', 'marca-oculta');
      m.title = 'oculta da grade';
      m.append(icone('olhoCortado'));
      marcas.append(m);
    }
    tile.append(marcas);
  }
  tile.append(statusSpan(status));
  if (subAg && status !== 'aguardando') tile.append(avisoSub('subagente aguardando'));
  tile.append(el('div', 'nome', nome));

  const linha = el('div', 'linha');
  const custo = formatarCusto(s.Total);
  linha.append(el('span', 'id', s.ShortID), el('span', 'custo' + (custo === 'n/d' ? ' nd' : ''), custo));
  tile.append(linha);

  const ferr = el('div', 'ferramenta' + (s.LastTool ? '' : ' vazia'));
  ferr.append(icone('ferramenta'), el('span', null, s.LastTool || '—'));
  tile.append(ferr);

  if (subs.length) {
    const box = el('div', 'subs');
    const feitos = subs.filter((a) => a.Status === 'concluido');
    for (const a of subs) if (a.Status !== 'concluido') box.append(miniTile(a, s.ID));
    if (feitos.length === 1) {
      const m = miniTile(feitos[0], s.ID);
      m.prepend(icone('check'));
      box.append(m);
    } else if (feitos.length > 1) {
      // Agrupado: o toque abre a sessão sem foco num subagente específico.
      const m = el('span', 'sub s-concluido');
      m.title = feitos.length + ' subagentes concluídos';
      m.append(icone('check'), el('span', 'tipo', feitos.length + ' concluídos'));
      box.append(m);
    }
    tile.append(box);
  }

  const rotulo = nome + (s.Account ? ', conta ' + s.Account : '') + ', ' + ROTULO[status] + (subAg ? ', subagente aguardando' : '') + ', ' + custo + (mudo ? ', alerta silenciado' : '') + (oculta ? ', oculta' : '');
  tile.setAttribute('aria-label', rotulo);
  return tile;
}

// corConta: mesma conta, mesma cor em qualquer aparelho (djb2 dos char codes).
// "outra" (diretório não declarado no -account) tem um tom neutro próprio.
function corConta(nome) {
  if (nome === 'outra') return 'outra';
  let h = 5381;
  for (let i = 0; i < nome.length; i++) h = (h * 33 + nome.charCodeAt(i)) >>> 0;
  return String(h % 4 + 1);
}

function chipConta(nome) {
  const c = el('span', 'conta c-' + corConta(nome), nome);
  c.title = 'conta ' + nome;
  return c;
}

function chip(numero, texto, classe) {
  const c = el('span', 'chip' + (classe ? ' ' + classe : ''));
  c.append(el('b', null, String(numero)), texto);
  return c;
}

// ---------- Sessões ocultas ----------
// Ocultar vale para o nome da sessão (--name ou /rename) ou, sem nome, para o
// cwd: a próxima sessão com o mesmo nome já nasce oculta. A lista fica só
// neste navegador. Oculta que precisa de atenção volta à grade.

const OCULTAS_CHAVE = 'fleet.ocultas';
let ocultas = lerOcultas();
let mostrarOcultas = false;  // chip "N oculta(s)" ligado
let ultimoSnapshot = [];
// Alerta silenciado (silenciar-agente): chaves de chavesAguardando() que não
// bipam nem contam para o lembrete. Só em memória e só nesta espera: o
// snapshot em que a chave sai de aguardando a tira daqui.
const silenciados = new Set();
let aguardandoAtual = new Set(); // chaves em aguardando no último snapshot do SSE

function lerOcultas() {
  try {
    const v = JSON.parse(localStorage.getItem(OCULTAS_CHAVE) || '[]');
    return new Set(Array.isArray(v) ? v.filter((k) => typeof k === 'string') : []);
  } catch (_) {
    return new Set();
  }
}

function gravarOcultas() {
  try { localStorage.setItem(OCULTAS_CHAVE, JSON.stringify([...ocultas])); } catch (_) { /* só nesta página */ }
}

// chaveOculta: "nome:<Name>", "cwd:<Cwd>" ou, sem os dois, "id:<ID>". Com
// conta, ganha o prefixo "<conta>|": o mesmo nome em outra conta não some
// junto.
function chaveOculta(s) {
  return (s.Account ? s.Account + '|' : '') + chaveSemConta(s);
}

// chaveSemConta é a chave de antes das contas. Algo ocultado assim, antes de o
// servidor ganhar -account, continua oculto em todas as contas.
function chaveSemConta(s) {
  if (s.Name) return 'nome:' + s.Name;
  if (s.Cwd) return 'cwd:' + s.Cwd;
  return 'id:' + s.ID;
}

function estaOculta(s) {
  return ocultas.has(chaveOculta(s)) || ocultas.has(chaveSemConta(s));
}

// rotuloOculta: como o pop-up nomeia o que será ocultado.
function rotuloOculta(s) {
  const alvo = s.Name ? 'sessões "' + s.Name + '"' : 'sessões em ' + (s.Cwd || s.ID);
  return s.Account ? alvo + ' da conta ' + s.Account : alvo;
}

function alternarOculta(s) {
  if (estaOculta(s)) {
    ocultas.delete(chaveOculta(s));
    ocultas.delete(chaveSemConta(s));
  } else {
    ocultas.add(chaveOculta(s));
  }
  gravarOcultas();
  render(ultimoSnapshot);
}

// ---------- Filtro por conta ----------
// Só visual: esconde tiles de outras contas. Som e push seguem todas as
// sessões (avaliarSom recebe o snapshot inteiro; o push é do servidor). A
// escolha fica neste navegador; se a conta salva sumiu dos tiles, mostra
// "todas" sem apagar a escolha, que volta quando a conta reaparecer.

const CONTA_CHAVE = 'fleet.conta';
const filtroRot = document.getElementById('filtro-conta-rotulo');
const filtroSel = document.getElementById('filtro-conta');
let contaEscolhida = lerConta();  // '' = todas
let contasNasOpcoes = null;       // evita recriar as opções (fecharia o <select> aberto)

function lerConta() {
  try { return localStorage.getItem(CONTA_CHAVE) || ''; } catch (_) { return ''; }
}

function gravarConta(c) {
  try {
    if (c) localStorage.setItem(CONTA_CHAVE, c);
    else localStorage.removeItem(CONTA_CHAVE);
  } catch (_) { /* só nesta página */ }
}

// contasDe: contas distintas do snapshot, "outra" por último. Sem conta não conta.
function contasDe(sessoes) {
  const set = new Set();
  for (const s of sessoes) if (s.Account) set.add(s.Account);
  return [...set].sort((a, b) => (a === 'outra') - (b === 'outra') || a.localeCompare(b));
}

// atualizarFiltro mostra o seletor só com 2+ contas e devolve a conta em
// vigor ('' = todas).
function atualizarFiltro(contas) {
  const mostrar = contas.length > 1;
  filtroRot.hidden = !mostrar;
  const chave = contas.join(' ');
  if (chave !== contasNasOpcoes) {
    contasNasOpcoes = chave;
    const todas = el('option', null, 'todas');
    todas.value = '';
    filtroSel.replaceChildren(todas, ...contas.map((c) => {
      const o = el('option', null, c);
      o.value = c;
      return o;
    }));
  }
  const vigente = mostrar && contas.includes(contaEscolhida) ? contaEscolhida : '';
  if (filtroSel.value !== vigente) filtroSel.value = vigente;
  filtroRot.className = 'chip filtro-conta' + (vigente ? ' conta c-' + corConta(vigente) + ' filtrando' : '');
  filtroRot.title = vigente ? 'Mostrando só a conta ' + vigente : 'Mostrando todas as contas';
  return vigente;
}

filtroSel.addEventListener('change', () => {
  contaEscolhida = filtroSel.value;
  gravarConta(contaEscolhida);
  render(ultimoSnapshot);
});

function render(sessoes) {
  ultimoSnapshot = sessoes;
  // Preserva o foco de teclado entre snapshots.
  const ativoEl = document.activeElement;
  const focoId = ativoEl && ativoEl.classList && ativoEl.classList.contains('tile') ? ativoEl.dataset.id : null;

  const conta = atualizarFiltro(contasDe(sessoes));
  const daConta = conta ? sessoes.filter((s) => s.Account === conta) : sessoes;
  const visiveis = daConta.filter((s) => !estaOculta(s));
  const nOcultas = daConta.length - visiveis.length;
  if (nOcultas === 0) mostrarOcultas = false;

  const frag = document.createDocumentFragment();
  for (const s of ordenar(daConta)) {
    const oculta = estaOculta(s);
    // Oculta em aguardando aparece como qualquer outra: nada trava escondido.
    if (oculta && precisaAtencao(s)) frag.append(montarTile(s, false));
    else if (!oculta || mostrarOcultas) frag.append(montarTile(s, oculta));
  }
  grade.replaceChildren(frag);
  vazio.hidden = grade.children.length > 0;
  vazio.textContent = daConta.length > 0 ? 'Todas as sessões estão ocultas.' : 'Nenhuma sessão no momento.';

  // "sessões" segue o filtro; "aguardando" é alerta e conta todas as contas.
  const aguardam = sessoes.filter(precisaAtencao).length;
  const foraDoFiltro = aguardam - daConta.filter(precisaAtencao).length;
  const cSessoes = chip(visiveis.length, visiveis.length === 1 ? 'sessão' : 'sessões');
  if (conta) cSessoes.title = 'da conta ' + conta;
  contador.replaceChildren(cSessoes);
  if (aguardam > 0) {
    const cAg = chip(aguardam, 'aguardando', 'alerta');
    if (foraDoFiltro > 0) cAg.title = 'inclui ' + foraDoFiltro + ' de outra' + (foraDoFiltro === 1 ? ' conta' : 's contas') + ', fora do filtro';
    contador.append(cAg);
  }
  if (nOcultas > 0) {
    const b = el('button', 'chip ocultas');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(mostrarOcultas));
    b.title = mostrarOcultas ? 'Esconder as sessões ocultas' : 'Mostrar as sessões ocultas';
    b.append(el('b', null, String(nOcultas)), nOcultas === 1 ? 'oculta' : 'ocultas');
    b.addEventListener('click', () => {
      mostrarOcultas = !mostrarOcultas;
      render(ultimoSnapshot);
      const novo = contador.querySelector('.ocultas');
      if (novo) novo.focus();
    });
    contador.append(b);
  }

  if (focoId) {
    for (const t of grade.children) {
      if (t.dataset.id === focoId) { t.focus(); break; }
    }
  }
}

// Clique/toque em qualquer ponto do tile; mini-tile informa o subagente.
grade.addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  const mini = e.target.closest('.sub');
  openDetail(tile.dataset.id, mini && mini.dataset.agent ? mini.dataset.agent : undefined);
});
grade.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tile = e.target.closest('.tile');
  if (!tile) return;
  e.preventDefault();
  openDetail(tile.dataset.id);
});

// ---------- Pop-up de detalhes ----------

const dlg = document.getElementById('detalhe');
const detEstado = document.getElementById('det-estado');
const detTitulo = document.getElementById('det-titulo');
const detSub = document.getElementById('det-sub');
const detCorpo = document.getElementById('det-corpo');
const detRodape = document.getElementById('det-rodape');
const detOcultar = document.getElementById('det-ocultar');
const detSilenciar = document.getElementById('det-silenciar');

const milhar = new Intl.NumberFormat('pt-BR');
const umaCasa = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const dataHora = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });
const hora = new Intl.DateTimeFormat('pt-BR', { timeStyle: 'medium' });

// Intervalo do polling de /api/session/{id} enquanto o pop-up está aberto.
const POLL_MS = 5000;

// As 5 categorias de tokens, na ordem da tabela (chaves de pricing.Tokens).
const CATEGORIAS = [
  ['Input', 'In', 'input'],
  ['Cache5m', 'C 5m', 'cache write 5 min'],
  ['Cache1h', 'C 1h', 'cache write 1 h'],
  ['CacheRead', 'Lido', 'cache read'],
  ['Output', 'Out', 'output'],
];

const ROTULO_ESTIMATIVA = 'estimativa pelo preço de lista da API';

// Estado do pop-up aberto. geracao muda a cada abertura/fechamento, para
// descartar respostas que chegam depois de o pop-up fechar ou trocar de sessão.
const det = {
  sessionId: null,
  agentId: null,
  geracao: 0,
  timer: null,      // setTimeout do próximo polling
  ctrl: null,       // AbortController da requisição em curso
  relogio: null,    // setInterval de 1 s dos contadores
  vivos: [],        // contadores ao vivo: { node, tipo, ini, fim }
  focado: false,    // já rolou até o subagente tocado
  dados: null,      // último SessionDetail recebido
  aviso: '',        // "sessão removida", falha de rede etc.
  atualizadoEm: null,
  sinalSom: '',     // sinalSilencio() do último desenho do pop-up
  modelosAbertos: new Set(), // subagentes com a lista de modelos aberta
};

// ms converte uma data do JSON em milissegundos; a data zero do Go vira null.
function ms(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  return Number.isFinite(t) && t > 0 ? t : null;
}

// duracao: "12 s", "3 min 07 s", "1 h 02 min 05 s", "2 d 03 h".
function duracao(msTotal) {
  let s = Math.max(0, Math.floor(msTotal / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const dd = (n) => String(n).padStart(2, '0');
  if (d > 0) return d + ' d ' + dd(h) + ' h';
  if (h > 0) return h + ' h ' + dd(m) + ' min ' + dd(s) + ' s';
  if (m > 0) return m + ' min ' + dd(s) + ' s';
  return s + ' s';
}

// relativo: "há 12 s", "há 3 min", "há 2 h", "há 1 d".
function relativo(msAtras) {
  const s = Math.max(0, Math.floor(msAtras / 1000));
  if (s < 60) return 'há ' + s + ' s';
  if (s < 3600) return 'há ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'há ' + Math.floor(s / 3600) + ' h';
  return 'há ' + Math.floor(s / 86400) + ' d';
}

// compacto: "412", "38,2 k", "402 k", "1,4 M". O valor exato vai no title.
function compacto(n) {
  if (n < 1000) return milhar.format(n);
  if (n < 1e6) return (n < 1e5 ? umaCasa.format(n / 1e3) : milhar.format(Math.round(n / 1e3))) + ' k';
  return umaCasa.format(n / 1e6) + ' M';
}

function somaTokens(t) {
  if (!t) return 0;
  return CATEGORIAS.reduce((acc, [k]) => acc + (t[k] || 0), 0);
}

// Valores abaixo de US$ 1 ganham até 4 casas no pop-up: sessões curtas custam
// frações de centavo e "< US$ 0,01" esconderia a diferença entre agentes.
const moedaFina = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });

function usd(v) {
  return 'US$ ' + (v < 1 ? moedaFina : moeda).format(v);
}

// formatarUso: "US$ 0,0061", "n/d" (sem preço e sem custo parcial) ou
// "≥ US$ X" (custo parcial). Uso ainda zerado (transcript não lido) conta
// como US$ 0,00, igual ao Store faz ao somar.
function formatarUso(u) {
  if (!u) return 'n/d';
  const v = u.CostUSD || 0;
  if (u.CostKnown || (v === 0 && somaTokens(u.Tokens) === 0)) return usd(v);
  if (v <= 0) return 'n/d';
  return '≥ ' + usd(v);
}

// fimDe: quando o tempo de vida para de contar. Encerrado/concluído sem
// EndedAt usa o último evento; em andamento, null (conta até agora).
function fimDe(obj, encerrado) {
  const fim = ms(obj.EndedAt);
  if (fim) return fim;
  return encerrado ? ms(obj.LastEventAt) : null;
}

// vivo cria um nó que o relógio de 1 s atualiza.
function vivo(tipo, ini, fim, classe) {
  const node = el(classe ? 'div' : 'span', classe || 'num');
  det.vivos.push({ node, tipo, ini, fim });
  return node;
}

function tique() {
  const agora = Date.now();
  for (const v of det.vivos) {
    if (v.ini == null) { v.node.textContent = '—'; continue; }
    v.node.textContent = v.tipo === 'vida'
      ? duracao((v.fim ?? agora) - v.ini)
      : relativo(agora - v.ini);
  }
}

// subagentesOrdenados: o JSON traz um mapa id → Agent; ordena por início e id.
function subagentesOrdenados(d) {
  const lista = Object.entries(d.Subagents || {}).map(([id, a]) => Object.assign({}, a, { ID: a.ID || id }));
  return lista.sort((a, b) =>
    (ms(a.StartedAt) || 0) - (ms(b.StartedAt) || 0) ||
    (a.ID < b.ID ? -1 : a.ID > b.ID ? 1 : 0));
}

// nomesAgentes dá um rótulo curto e único por subagente: a descrição dada na
// chamada do Agent ou, sem ela, o tipo ("Explore", "Explore 2").
function nomesAgentes(subs) {
  const vistos = {};
  return subs.map((a) => {
    const base = a.Description || a.Type || 'subagente';
    vistos[base] = (vistos[base] || 0) + 1;
    return vistos[base] > 1 ? base + ' ' + vistos[base] : base;
  });
}

function secao(titulo, conteudo) {
  const s = el('section');
  s.append(el('h3', null, titulo), conteudo);
  return s;
}

function metrica(rotulo, valor, opts) {
  const m = el('div', 'metrica');
  m.append(el('div', 'k' + (opts && opts.vivo ? ' vivo' : ''), rotulo));
  if (valor instanceof Node) m.append(valor);
  else m.append(el('div', 'v' + (opts && opts.texto ? ' txt' : ''), valor));
  return m;
}

// montarTabela: linhas = principal, cada subagente e total; colunas = categorias.
// Com uma linha por agente a tabela cresce para baixo e cabe em 360 px.
function montarTabela(d, subs, nomes) {
  const linhas = [{ nome: 'Principal', uso: d.Main, id: null }];
  subs.forEach((a, i) => linhas.push({ nome: nomes[i], uso: a.Usage, id: a.ID }));
  linhas.push({ nome: 'Total', uso: d.Total, id: null, total: true });

  const tabela = el('table', 'tokens');
  const thead = el('thead');
  const hr = el('tr');
  const th0 = el('th', null, 'Agente');
  th0.scope = 'col';
  hr.append(th0);
  for (const [, curto, longo] of CATEGORIAS) {
    const th = el('th', null, curto);
    th.scope = 'col';
    th.title = longo;
    hr.append(th);
  }
  thead.append(hr);
  tabela.append(thead);

  const tbody = el('tbody');
  for (const l of linhas) {
    const tr = el('tr', l.total ? 'soma' : null);
    if (l.id && l.id === det.agentId) tr.classList.add('foco');
    const th = el('th', null, l.nome);
    th.scope = 'row';
    th.title = l.nome;
    tr.append(th);
    const t = (l.uso && l.uso.Tokens) || {};
    for (const [k, , longo] of CATEGORIAS) {
      const n = t[k] || 0;
      const td = el('td', n === 0 ? 'zero' : null, compacto(n));
      td.title = longo + ': ' + milhar.format(n);
      tr.append(td);
    }
    tbody.append(tr);
  }
  tabela.append(tbody);

  const wrap = el('div', 'tabela-wrap');
  wrap.append(tabela);
  const box = el('div');
  box.append(wrap, el('p', 'legenda', 'C 5m / C 1h = cache write · Lido = cache read'));
  return box;
}

// custoConhecido: uso zerado (transcript ainda não lido) conta como custo
// conhecido de US$ 0, igual ao Store faz ao somar.
function custoConhecido(u) {
  return !!u && (!!u.CostKnown || ((u.CostUSD || 0) === 0 && somaTokens(u.Tokens) === 0));
}

// somarUso soma dois Usage; o custo só é conhecido se os dois forem.
function somarUso(a, b) {
  const t = {};
  for (const [k] of CATEGORIAS) t[k] = ((a.Tokens || {})[k] || 0) + ((b.Tokens || {})[k] || 0);
  return { Tokens: t, CostUSD: (a.CostUSD || 0) + (b.CostUSD || 0), CostKnown: custoConhecido(a) && custoConhecido(b) };
}

// usoPorModelo soma, por nome de modelo, a sessão principal e todos os
// subagentes: o mesmo modelo costuma aparecer em vários deles.
function usoPorModelo(d, subs) {
  const soma = new Map();
  for (const models of [d.Models, ...subs.map((a) => a.Models)]) {
    for (const [m, u] of Object.entries(models || {})) soma.set(m, somarUso(soma.get(m) || {}, u));
  }
  return soma;
}

const pct = new Intl.NumberFormat('pt-BR', { style: 'percent', maximumFractionDigits: 1 });

// taxaCache: cache read ÷ (input + cache write + cache read); "—" sem
// nenhum token de entrada.
function taxaCache(t) {
  t = t || {};
  const lido = t.CacheRead || 0;
  const den = (t.Input || 0) + (t.Cache5m || 0) + (t.Cache1h || 0) + lido;
  return den > 0 ? pct.format(lido / den) : '—';
}

// montarModelos: uma linha por modelo, do mais caro ao mais barato, com
// tokens, custo e acerto de cache; com dois modelos ou mais, uma linha Total.
function montarModelos(d, subs) {
  const porModelo = usoPorModelo(d, subs);
  if (!porModelo.size) return el('p', 'vazio-det', '—');
  const linhas = [...porModelo]
    .sort(([na, a], [nb, b]) => (b.CostUSD || 0) - (a.CostUSD || 0) || (na < nb ? -1 : na > nb ? 1 : 0))
    .map(([nome, uso]) => ({ nome, uso }));
  if (linhas.length > 1) linhas.push({ nome: 'Total', uso: d.Total, total: true });

  const tabela = el('table', 'tokens por-modelo');
  const thead = el('thead');
  const hr = el('tr');
  for (const [rot, titulo] of [
    ['Modelo', null],
    ['Tokens', 'soma das 5 categorias'],
    ['Custo', ROTULO_ESTIMATIVA],
    ['Cache', 'acerto de cache: cache read ÷ (input + cache write + cache read)'],
  ]) {
    const th = el('th', null, rot);
    th.scope = 'col';
    if (titulo) th.title = titulo;
    hr.append(th);
  }
  thead.append(hr);
  tabela.append(thead);

  const tbody = el('tbody');
  for (const l of linhas) {
    const tr = el('tr', l.total ? 'soma' : null);
    const th = el('th', null, l.nome);
    th.scope = 'row';
    th.title = l.nome;
    const t = (l.uso && l.uso.Tokens) || {};
    const n = somaTokens(t);
    const tdTokens = el('td', n === 0 ? 'zero' : null, compacto(n));
    tdTokens.title = milhar.format(n) + ' tokens';
    const custo = formatarUso(l.uso);
    const tdCusto = el('td', custo === 'n/d' ? 'zero' : null, custo);
    if (custo === 'n/d') tdCusto.title = 'modelo sem preço na tabela';
    const cache = taxaCache(t);
    tr.append(th, tdTokens, tdCusto, el('td', cache === '—' ? 'zero' : null, cache));
    tbody.append(tr);
  }
  tabela.append(tbody);

  const wrap = el('div', 'tabela-wrap');
  wrap.append(tabela);
  const box = el('div');
  box.append(wrap, el('p', 'legenda', 'Custo: ' + ROTULO_ESTIMATIVA + ' · Cache = cache read ÷ (input + cache write + cache read)'));
  return box;
}

function metaItem(rotulo, valor) {
  const s = el('span');
  const b = valor instanceof Node ? valor : el('b', null, valor);
  s.append(rotulo + ' ', b);
  return s;
}

// modelosDoAgente: [nome, Usage] do modelo que mais custou ao que menos
// custou, empate pelo nome (a ordem de montarModelos); vazio enquanto o
// transcript não foi lido.
function modelosDoAgente(a) {
  return Object.entries(a.Models || {})
    .sort(([na, x], [nb, y]) => (y.CostUSD || 0) - (x.CostUSD || 0) || (na < nb ? -1 : na > nb ? 1 : 0));
}

// botaoModelo: o modelo que mais custou, sem o prefixo "claude-", e "+N" se
// houve outros. Um toque abre a lista de modelosAgente, porque o title não
// abre no celular.
function botaoModelo(a, lista, aberto) {
  const b = el('button', 'modelo-btn');
  b.type = 'button';
  b.dataset.agent = a.ID;
  b.dataset.foco = 'modelo:' + a.ID;
  b.setAttribute('aria-expanded', String(aberto));
  b.setAttribute('aria-controls', 'modelos-' + a.ID);
  const nome = el('b', null, lista[0][0].replace(/^claude-/, ''));
  if (lista.length > 1) nome.append(' +' + (lista.length - 1));
  b.append('modelo ', nome, icone('seta'));
  return b;
}

// modelosAgente: nome completo e custo de cada modelo do subagente.
function modelosAgente(a, lista) {
  const ul = el('ul', 'modelos-ag');
  ul.id = 'modelos-' + a.ID;
  for (const [m, u] of lista) {
    const li = el('li');
    li.append(el('span', null, m), el('b', null, formatarUso(u)));
    ul.append(li);
  }
  return ul;
}

function montarAgente(a, nome) {
  const li = el('li', 'agente');
  li.dataset.agent = a.ID;
  const foco = a.ID === det.agentId;
  if (foco) li.classList.add('foco');

  const cab = el('div', 'cab');
  const titulo = el('div', 'titulo');
  titulo.append(el('span', 'tipo', nome));
  if (a.Description && a.Type) titulo.append(el('span', 'subtipo', a.Type));
  if (foco) titulo.append(el('span', 'em-foco', 'em foco'));
  const dir = el('span', 'cab-dir');
  const chave = det.sessionId + '/' + a.ID;
  if (podeSilenciar(chave)) {
    const mudo = silenciados.has(chave);
    const b = el('button', 'silenciar-sub');
    b.type = 'button';
    b.dataset.chave = chave;
    b.dataset.foco = 'som:' + chave;
    b.setAttribute('aria-pressed', String(mudo));
    // Rótulo fixo: o estado vai só no aria-pressed (padrão de toggle button).
    b.setAttribute('aria-label', 'Silenciar ' + nome);
    b.title = (mudo ? 'Reativar som de ' : 'Silenciar ') + nome;
    b.append(icone(mudo ? 'somDesligado' : 'somLigado', 14));
    dir.append(b);
  }
  dir.append(statusSpan(a.Status));
  cab.append(titulo, dir);
  li.append(cab);

  const meta = el('div', 'meta');
  const vida = vivo('vida', ms(a.StartedAt), fimDe(a, a.Status === 'concluido'));
  const b = el('b');
  b.append(vida);
  const modelos = modelosDoAgente(a);
  const aberto = modelos.length > 0 && det.modelosAbertos.has(a.ID);
  if (modelos.length) meta.append(botaoModelo(a, modelos, aberto));
  meta.append(
    metaItem('vida', b),
    metaItem('tokens', compacto(somaTokens(a.Usage && a.Usage.Tokens))),
    metaItem('custo', formatarUso(a.Usage)));
  if (a.LastTool) meta.append(metaItem('última', a.LastTool));
  li.append(meta);
  if (aberto) li.append(modelosAgente(a, modelos));
  return li;
}

function alertaRodape(texto) {
  const p = el('div', 'alerta');
  p.append(icone('aviso'), el('span', null, texto));
  return p;
}

function renderDetalhe() {
  const d = det.dados;
  det.vivos = [];

  const frag = document.createDocumentFragment();
  if (det.aviso) frag.append(el('p', 'aviso', det.aviso));

  atualizarDetSilenciar();
  detOcultar.hidden = !d;
  if (d) {
    const oculta = estaOculta(d);
    detOcultar.replaceChildren(icone(oculta ? 'olho' : 'olhoCortado'), el('span', null, oculta ? 'Mostrar na grade' : 'Ocultar'));
    detOcultar.setAttribute('aria-label', (oculta ? 'Mostrar na grade as ' : 'Ocultar da grade as ') + rotuloOculta(d));
    detOcultar.title = detOcultar.getAttribute('aria-label');
  }

  if (!d) {
    if (!det.aviso) frag.append(el('p', 'vazio-det', 'carregando…'));
    detCorpo.replaceChildren(frag);
    detRodape.replaceChildren();
    return;
  }

  const subs = subagentesOrdenados(d);
  const nomes = nomesAgentes(subs);
  const encerrada = d.Status === 'encerrado';

  // Cabeçalho fixo: status, nome, projeto · id curto.
  detEstado.replaceChildren(statusSpan(d.Status));
  const aguardam = subs.filter((a) => a.Status === 'aguardando').length;
  if (aguardam > 0) {
    detEstado.append(avisoSub(aguardam + (aguardam === 1 ? ' subagente aguardando' : ' subagentes aguardando')));
  }
  detTitulo.textContent = d.Name || d.Project || d.ID;
  detSub.replaceChildren();
  if (d.Account) detSub.append(chipConta(d.Account), el('span', null, '·'));
  detSub.append(el('span', null, d.Project || '—'), el('span', null, '·'));
  const idCurto = el('span', 'mono', d.ID.slice(0, 8));
  idCurto.title = d.ID;
  detSub.append(idCurto);

  const cwd = el('p', 'cwd', d.Cwd || '—');
  cwd.title = d.Cwd || '';
  frag.append(cwd);

  // Custo em destaque, sempre rotulado como estimativa.
  const custo = el('div', 'custo-box');
  const cl = el('div', 'linha');
  cl.append(el('p', 'custo-total', formatarUso(d.Total)), el('span', 'rot', 'total da sessão'));
  custo.append(cl, el('p', 'rotulo-estimativa', ROTULO_ESTIMATIVA + ' (não é cobrança real)'));
  frag.append(custo);

  const ini = ms(d.StartedAt);
  const met = el('div', 'metricas');
  const inicio = metrica('Início', ini ? hora.format(ini) : '—');
  if (ini) inicio.title = dataHora.format(ini);
  met.append(
    inicio,
    metrica('Tempo de vida', vivo('vida', ini, fimDe(d, encerrada), 'v'), { vivo: !encerrada }),
    metrica('Última atividade', vivo('rel', ms(d.LastEventAt), null, 'v')),
    metrica('Última ferramenta', d.LastTool || '—', { texto: true }));
  frag.append(met);

  frag.append(secao('Modelos', montarModelos(d, subs)));

  frag.append(secao('Tokens por agente', montarTabela(d, subs, nomes)));

  let lista;
  if (subs.length) {
    lista = el('ul', 'agentes');
    subs.forEach((a, i) => lista.append(montarAgente(a, nomes[i])));
  } else {
    lista = el('p', 'vazio-det', 'nenhum subagente nesta sessão');
  }
  frag.append(secao('Subagentes · ' + subs.length, lista));

  // O corpo é recriado a cada poll e snapshot: o foco num botão de silenciar
  // ou de modelo volta para o botão novo com o mesmo data-foco.
  const ativo = document.activeElement;
  const chaveFoco = ativo && detCorpo.contains(ativo) ? ativo.dataset.foco : null;
  detCorpo.replaceChildren(frag);
  if (chaveFoco) {
    for (const n of detCorpo.querySelectorAll('[data-foco]')) {
      if (n.dataset.foco === chaveFoco) { n.focus({ preventScroll: true }); break; }
    }
  }

  detRodape.replaceChildren();
  if (d.TranscriptMissing) detRodape.append(alertaRodape('Transcript indisponível · mostrando os últimos totais lidos'));
  if (d.ParseErrors > 0) {
    detRodape.append(alertaRodape(d.ParseErrors + (d.ParseErrors === 1 ? ' linha ilegível' : ' linhas ilegíveis') + ' no transcript'));
  }
  if (det.atualizadoEm) detRodape.append(el('div', null, 'atualizado às ' + hora.format(det.atualizadoEm)));

  tique();

  // Aberto por um mini-tile: rola até o subagente uma única vez.
  if (det.agentId && !det.focado) {
    for (const li of detCorpo.querySelectorAll('.agente')) {
      if (li.dataset.agent === det.agentId) {
        li.scrollIntoView({ block: 'center' });
        det.focado = true;
        break;
      }
    }
  }
}

// buscar faz uma requisição e agenda a próxima só quando ela termina, para
// não empilhar requisições em rede lenta. fetch na mesma origem já envia o
// cookie de acesso.
async function buscar(geracao) {
  det.ctrl = new AbortController();
  let parar = false;
  try {
    const r = await fetch('/api/session/' + encodeURIComponent(det.sessionId), {
      signal: det.ctrl.signal,
      cache: 'no-store',
    });
    if (geracao !== det.geracao) return;
    if (r.status === 404) {
      det.aviso = 'sessão removida';
      parar = true; // o Store não traz de volta uma sessão podada
    } else if (r.status === 401) {
      det.aviso = 'não autorizado — recarregue a página';
      parar = true;
    } else if (!r.ok) {
      det.aviso = 'falha ao atualizar (HTTP ' + r.status + ') — tentando de novo';
    } else {
      const d = await r.json();
      if (geracao !== det.geracao) return;
      det.dados = d;
      det.aviso = '';
      det.atualizadoEm = Date.now();
    }
  } catch (e) {
    if (geracao !== det.geracao || (e && e.name === 'AbortError')) return;
    det.aviso = 'sem conexão com o servidor — tentando de novo';
  }
  det.ctrl = null;
  renderDetalhe();
  if (!parar && geracao === det.geracao && dlg.open) {
    det.timer = setTimeout(() => buscar(geracao), POLL_MS);
  }
}

// pararDetalhe cancela polling, requisição em curso e relógio.
function pararDetalhe() {
  det.geracao++;
  clearTimeout(det.timer);
  det.timer = null;
  if (det.ctrl) det.ctrl.abort();
  det.ctrl = null;
  clearInterval(det.relogio);
  det.relogio = null;
  det.vivos = [];
}

/**
 * Abre o detalhe de uma sessão num <dialog>, sem mudar a URL. Busca
 * /api/session/{id} a cada 5 s enquanto aberto e, quando agentId vier
 * preenchido (toque num mini-tile), rola até esse subagente e o destaca.
 *
 * @param {string} sessionId  ID completo da sessão (SessionView.ID).
 * @param {string} [agentId]  ID do subagente, se o toque foi num mini-tile.
 */
function openDetail(sessionId, agentId) {
  if (!sessionId) return;
  pararDetalhe();
  det.sessionId = sessionId;
  det.agentId = agentId || null;
  det.focado = false;
  det.modelosAbertos.clear();
  det.dados = null;
  det.aviso = '';
  det.atualizadoEm = null;
  detEstado.replaceChildren();
  detTitulo.textContent = 'Sessão ' + sessionId.slice(0, 8);
  detSub.replaceChildren();
  detCorpo.scrollTop = 0;
  renderDetalhe();

  if (!dlg.open) dlg.showModal();
  document.body.classList.add('modal-aberto');
  det.relogio = setInterval(tique, 1000);
  buscar(det.geracao);
}

function fecharDetalhe() {
  if (dlg.open) dlg.close();
}

document.getElementById('det-fechar').addEventListener('click', fecharDetalhe);
// Ocultar fecha o pop-up (o tile sai da grade); mostrar mantém aberto.
detOcultar.addEventListener('click', () => {
  const d = det.dados;
  if (!d) return;
  const ocultando = !estaOculta(d);
  alternarOculta(d);
  if (ocultando) fecharDetalhe();
  else renderDetalhe();
});
// Silenciar não fecha o pop-up: o agente segue em aguardando na grade.
detSilenciar.addEventListener('click', () => {
  const d = det.dados;
  if (!d) return;
  alternarSilencio(d.ID);
  detSilenciar.focus();
});
// Botões de silenciar e de modelo de cada subagente; renderDetalhe devolve
// o foco.
detCorpo.addEventListener('click', (e) => {
  const b = e.target.closest('.silenciar-sub, .modelo-btn');
  if (!b) return;
  e.stopPropagation();
  b.focus(); // Safari não foca botão no clique
  if (b.classList.contains('silenciar-sub')) {
    alternarSilencio(b.dataset.chave);
    return;
  }
  const id = b.dataset.agent;
  if (!det.modelosAbertos.delete(id)) det.modelosAbertos.add(id);
  renderDetalhe();
});
// Toque fora: o clique cai no próprio <dialog> (o backdrop), não no conteúdo.
dlg.addEventListener('click', (e) => {
  if (e.target === dlg) fecharDetalhe();
});
// Esc dispara "cancel" e depois "close"; o "close" cobre todas as saídas.
dlg.addEventListener('close', () => {
  pararDetalhe();
  document.body.classList.remove('modal-aberto');
  // Devolve o foco ao tile da sessão (a grade pode ter sido recriada); se
  // ele saiu da grade (ocultado), ao primeiro tile.
  let alvo = null;
  for (const t of grade.children) {
    if (t.dataset.id === det.sessionId) { alvo = t; break; }
  }
  alvo = alvo || grade.firstElementChild;
  if (alvo) alvo.focus({ preventScroll: true });
});

// ---------- Uso do plano ----------
// Um bloco por conta, com os medidores da janela de 5 h e da semana. Os dados
// vêm de GET /api/uso no carregamento e do evento "uso" do SSE. Tudo vai por
// textContent: nada do servidor entra como HTML.

const usoContas = document.getElementById('uso-contas');
const USO_ALERTA = 80;
const USO_CRITICO = 95;
const USO_VELHO_MS = 60 * 60 * 1000; // dado com mais de 1 h fica em --muted
const JANELAS = [['five_hour', 'Sessão (5 h)'], ['seven_day', 'Semana']];
const horaMin = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' });
const diaSemana = new Intl.DateTimeFormat('pt-BR', { weekday: 'short' });
const diaMes = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit' });

let usoDados = null;   // null: ainda nada; senão, a última lista recebida
let usoViaSSE = false; // o SSE ganha do fetch inicial, se chegar antes

function receberUso(lista, doSSE) {
  if (!doSSE && usoViaSSE) return;
  if (doSSE) usoViaSSE = true;
  usoDados = Array.isArray(lista) ? lista : [];
  renderUso();
}

// "2 h 14 min", "3 d 4 h", "12 min", "menos de 1 min".
function duracao(ms) {
  const min = Math.floor(ms / 60000);
  if (min < 1) return 'menos de 1 min';
  const d = Math.floor(min / 1440), h = Math.floor(min % 1440 / 60), m = min % 60;
  if (d > 0) return d + ' d' + (h ? ' ' + h + ' h' : '');
  if (h > 0) return h + ' h' + (m ? ' ' + m + ' min' : '');
  return m + ' min';
}

function atualizadoHa(ms) {
  const min = Math.floor(Math.max(0, ms) / 60000);
  if (min < 1) return 'atualizado agora';
  if (min < 60) return 'atualizado há ' + min + ' min';
  const h = Math.floor(min / 60);
  if (h < 24) return 'atualizado há ' + h + ' h';
  return 'atualizado há ' + Math.floor(h / 24) + ' d';
}

// "reinicia às 14:30 · em 2 h 14 min"; em outro dia, "reinicia sáb. às 14:30";
// a uma semana ou mais, também o dia do mês, para não confundir com hoje.
function textoReset(quando, agora) {
  const hoje = new Date(agora);
  let dia = '';
  if (quando.toDateString() !== hoje.toDateString()) {
    dia = diaSemana.format(quando) + ' ';
    if (quando - agora >= 6 * 86400000) dia += diaMes.format(quando) + ' ';
  }
  return 'reinicia ' + dia + 'às ' + horaMin.format(quando) + ' · em ' + duracao(quando - agora);
}

function medidor(rotulo, janela, agora) {
  const m = el('div', 'medidor');
  const topo = el('div', 'med-topo');
  const barra = el('div', 'med-barra');
  const cheio = el('div', 'med-cheio');
  barra.append(cheio);
  barra.setAttribute('role', 'meter');
  barra.setAttribute('aria-label', rotulo);
  barra.setAttribute('aria-valuemin', '0');
  barra.setAttribute('aria-valuemax', '100');
  topo.append(el('span', 'med-nome', rotulo));
  m.append(topo, barra);

  const pctBruto = janela ? Number(janela.used_percentage) : NaN;
  const reset = janela ? Number(janela.resets_at) * 1000 : NaN;
  // Janela ausente depois de já ter dado, ou reset no passado: o percentual
  // antigo não vale mais.
  if (!Number.isFinite(pctBruto) || !Number.isFinite(reset) || reset <= agora) {
    m.classList.add('reiniciada');
    const txt = 'reiniciada, aguardando dado novo';
    topo.append(el('span', 'med-estado', txt));
    barra.setAttribute('aria-valuenow', '0');
    barra.setAttribute('aria-valuetext', txt);
    return m;
  }
  const pctVal = Math.max(0, pctBruto);
  const redondo = Math.round(pctVal);
  if (pctVal >= USO_CRITICO) m.classList.add('critico');
  else if (pctVal >= USO_ALERTA) m.classList.add('alerta');
  topo.append(el('span', 'med-pct', redondo + '%'));
  cheio.style.width = Math.min(100, pctVal) + '%';
  barra.setAttribute('aria-valuenow', String(Math.min(100, pctVal)));
  const reinicia = textoReset(new Date(reset), agora);
  barra.setAttribute('aria-valuetext', redondo + '% usado, ' + reinicia);
  m.append(el('div', 'med-reset', reinicia));
  return m;
}

// Linhas das janelas: rótulo curto, chave em u.windows.
const JANELAS_TOKENS = [['five_hour', '5 h', 'janela de 5 h'], ['seven_day', 'Semana', 'janela semanal']];

// janelasUso: tabela "entrada · cache · saída · custo" por janela, com os
// totais que o servidor soma dos transcripts. Sem windows, nada.
function janelasUso(w) {
  if (!w || typeof w !== 'object') return null;
  const tabela = el('table');
  const thead = el('thead');
  const hr = el('tr');
  const cab = [['Tokens', null], ['entrada', 'input'], ['cache', 'cache write 5 min + cache write 1 h + cache read'], ['saída', 'output'], ['custo', ROTULO_ESTIMATIVA]];
  for (const [txt, longo] of cab) {
    const th = el('th', null, txt);
    th.scope = 'col';
    if (longo) th.title = longo;
    hr.append(th);
  }
  thead.append(hr);
  const tbody = el('tbody');
  let linhas = 0;
  for (const [chave, rotulo, longo] of JANELAS_TOKENS) {
    const j = w[chave];
    if (!j || typeof j !== 'object') continue;
    const t = (j.tokens && typeof j.tokens === 'object') ? j.tokens : {};
    const n = (k) => { const v = Number(t[k]); return Number.isFinite(v) && v > 0 ? v : 0; };
    const cache = n('Cache5m') + n('Cache1h') + n('CacheRead');
    const tr = el('tr');
    const th = el('th', null, rotulo);
    th.scope = 'row';
    th.title = longo;
    tr.append(th);
    const celulas = [
      [n('Input'), 'input: ' + milhar.format(n('Input'))],
      [cache, 'cache write 5 min: ' + milhar.format(n('Cache5m')) + ' · cache write 1 h: ' + milhar.format(n('Cache1h')) + ' · cache read: ' + milhar.format(n('CacheRead'))],
      [n('Output'), 'output: ' + milhar.format(n('Output'))],
    ];
    for (const [v, tit] of celulas) {
      const td = el('td', v === 0 ? 'zero' : null, compacto(v));
      td.title = tit;
      tr.append(td);
    }
    const custo = Number(j.cost_usd);
    const uso = { Tokens: t, CostUSD: Number.isFinite(custo) ? custo : 0, CostKnown: j.cost_known === true };
    const tc = el('td', 'custo', formatarUso(uso));
    tc.title = ROTULO_ESTIMATIVA;
    tr.append(tc);
    tbody.append(tr);
    linhas++;
  }
  if (!linhas) return null;
  tabela.append(thead, tbody);
  const box = el('div', 'uso-janelas');
  box.append(tabela, el('p', 'legenda', 'Somado dos transcripts · custo: ' + ROTULO_ESTIMATIVA));
  return box;
}

function blocoUso(u, comNome, agora) {
  const b = el('section', 'uso-conta');
  const cab = el('div', 'uso-cab');
  const titulo = el('h3');
  if (comNome) {
    const nome = typeof u.account === 'string' && u.account ? u.account : 'padrão';
    titulo.append(chipConta(nome));
    b.setAttribute('aria-label', 'Conta ' + nome);
  }
  const recebido = Date.parse(u.received_at);
  if (!Number.isFinite(recebido)) {
    if (comNome) { cab.append(titulo); b.append(cab); }
    b.append(el('p', 'uso-sem-dado', 'sem dado do plano ainda — abra uma sessão do Claude Code'));
    const jan = janelasUso(u.windows);
    if (jan) b.append(jan);
    return b;
  }
  const at = el('span', 'uso-atualizado', atualizadoHa(agora - recebido));
  if (agora - recebido > USO_VELHO_MS) at.classList.add('velho');
  at.title = dataHora.format(new Date(recebido));
  if (comNome) cab.append(titulo);
  cab.append(at);
  b.append(cab);
  const meds = el('div', 'uso-medidores');
  for (const [chave, rotulo] of JANELAS) meds.append(medidor(rotulo, u[chave], agora));
  b.append(meds);
  const jan = janelasUso(u.windows);
  if (jan) b.append(jan);
  return b;
}

function renderUso() {
  if (usoDados === null) return;
  const agora = Date.now();
  // Sem nenhuma conta na lista, a conta implícita ainda não recebeu nada.
  const lista = usoDados.length ? usoDados.filter((u) => u && typeof u === 'object') : [{ account: '' }];
  const comNome = lista.length > 1;
  usoContas.classList.toggle('uma', !comNome);
  usoContas.replaceChildren(...lista.map((u) => blocoUso(u, comNome, agora)));
}

// Contagens andam a cada 30 s, só com a tela de uso à vista.
setInterval(() => {
  if (telaAtual === 'uso' && !document.hidden) renderUso();
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && telaAtual === 'uso') renderUso();
});

(async () => {
  try {
    const r = await fetch('/api/uso', { credentials: 'same-origin' });
    if (!r.ok) return;
    receberUso(await r.json(), false);
  } catch (_) { /* sem rede: o SSE traz o uso ao conectar */ }
})();

// ---------- Duas telas: sessões e uso do plano ----------
// Troca por arrasto horizontal de um dedo, pelos pontinhos e pelas setas.
// A tela escondida fica inert (sem Tab nem leitor de tela). A última tela
// aberta fica no localStorage deste aparelho.

const telas = document.getElementById('telas');
const pontos = document.getElementById('pontos');
const TELA_CHAVE = 'fleet.tela';
const TELAS = ['sessoes', 'uso'];
const SECAO = { sessoes: document.getElementById('tela-sessoes'), uso: document.getElementById('tela-uso') };
// Arrasto: anda pelo menos 60 px e é claramente horizontal (|dx| > 2·|dy|).
const ARRASTO_MIN = 60;

let telaAtual = 'sessoes';

function lerTela() {
  try {
    const v = localStorage.getItem(TELA_CHAVE);
    return TELAS.includes(v) ? v : 'sessoes';
  } catch (_) { return 'sessoes'; }
}

function gravarTela(t) {
  try { localStorage.setItem(TELA_CHAVE, t); } catch (_) { /* só nesta página */ }
}

function mostrarTela(t, gravar) {
  if (!TELAS.includes(t)) return;
  telaAtual = t;
  telas.dataset.tela = t;
  for (const nome of TELAS) SECAO[nome].inert = nome !== t;
  for (const b of pontos.querySelectorAll('button')) {
    b.setAttribute('aria-current', b.dataset.tela === t ? 'true' : 'false');
  }
  if (t === 'uso') renderUso(); // contagens em dia ao entrar
  // O foco não pode ficar preso na tela que acabou de virar inert.
  const foco = document.activeElement;
  if (foco && foco !== document.body && SECAO[t === 'uso' ? 'sessoes' : 'uso'].contains(foco)) {
    pontos.querySelector('button[aria-current="true"]').focus({ preventScroll: true });
  }
  if (gravar) gravarTela(t);
}

function trocarTela(passo) {
  const i = TELAS.indexOf(telaAtual) + passo;
  if (i >= 0 && i < TELAS.length && TELAS[i] !== telaAtual) mostrarTela(TELAS[i], true);
}

// Abre direto na tela lembrada, sem deslizar no carregamento.
telas.classList.add('sem-transicao');
mostrarTela(lerTela(), false);
requestAnimationFrame(() => requestAnimationFrame(() => telas.classList.remove('sem-transicao')));

pontos.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tela]');
  if (b) mostrarTela(b.dataset.tela, true);
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || dlg.open) return;
  const alvo = e.target;
  if (alvo && alvo.closest && alvo.closest('input, select, textarea, [contenteditable]:not([contenteditable="false"])')) return;
  e.preventDefault();
  trocarTela(e.key === 'ArrowRight' ? 1 : -1);
});

// Só toque e caneta: no desktop o mouse seleciona texto, e lá há setas e
// pontinhos. Um arrasto vertical vira rolagem do navegador e chega aqui como
// pointercancel, então não troca de tela.
let arrasto = null;
let engolirClique = false;

telas.addEventListener('pointerdown', (e) => {
  engolirClique = false;
  arrasto = null;
  if (e.pointerType === 'mouse' || !e.isPrimary || dlg.open) return;
  if (e.target.closest('select')) return;
  arrasto = { id: e.pointerId, x: e.clientX, y: e.clientY };
});

telas.addEventListener('pointerup', (e) => {
  if (!arrasto || e.pointerId !== arrasto.id) return;
  const dx = e.clientX - arrasto.x;
  const dy = e.clientY - arrasto.y;
  arrasto = null;
  if (dlg.open || Math.abs(dx) < ARRASTO_MIN || Math.abs(dx) <= 2 * Math.abs(dy)) return;
  // O dedo que trocou de tela não abre o tile em que soltou.
  engolirClique = true;
  setTimeout(() => { engolirClique = false; }, 400);
  trocarTela(dx < 0 ? 1 : -1);
});

telas.addEventListener('pointercancel', () => { arrasto = null; });

telas.addEventListener('click', (e) => {
  if (!engolirClique) return;
  engolirClique = false;
  e.preventDefault();
  e.stopPropagation();
}, true);

// ---------- Alerta sonoro ----------
// Toca quando uma sessão ou subagente entra em aguardando e repete a cada
// 30 s enquanto algo seguir assim. Toca outro som, uma vez, quando a sessão
// principal termina um turno longo. O som é gerado com Web Audio; o
// navegador só libera o áudio depois de um gesto na página.

const somBtn = document.getElementById('som');
const SOM_CHAVE = 'fleet.som';
const LEMBRETE_MS = 30000;
const TURNO_MIN_MS = 20000;  // turno mais curto que isso não avisa o fim
const AudioCtx = window.AudioContext || window.webkitAudioContext;

let somLigado = false;
let audio = null;            // AudioContext único, criado sob demanda
let aguardandoAntes = null;  // chaves em aguardando no snapshot anterior; null = sem linha de base
let referencia = 0;          // último toque ou linha de base: o lembrete conta a partir daqui
let statusAntes = null;      // status de cada sessão no snapshot anterior; null = sem linha de base
const inicioTurno = new Map(); // sessão → instante em que entrou em ativo/aguardando

function lerSom() {
  try { return localStorage.getItem(SOM_CHAVE) === '1'; } catch (_) { return false; }
}

function gravarSom(ligado) {
  try { localStorage.setItem(SOM_CHAVE, ligado ? '1' : '0'); } catch (_) { /* só nesta página */ }
}

// garantirAudio cria o AudioContext e tenta destravá-lo. Fora de um gesto do
// usuário o resume() é recusado e o contexto segue suspenso.
function garantirAudio() {
  if (!audio) {
    try {
      audio = new AudioCtx();
    } catch (_) {
      return null;
    }
    audio.addEventListener('statechange', atualizarSomBtn);
  }
  if (audio.state === 'suspended') audio.resume().catch(() => {});
  return audio;
}

// notas toca [frequência, atraso] em sequência; com o áudio bloqueado, não
// agenda nada para não acumular toques que soariam todos juntos ao destravar.
function notas(lista, pico, dur) {
  const ctx = garantirAudio();
  if (!ctx || ctx.state !== 'running') return;
  const t0 = ctx.currentTime + 0.01;
  for (const [freq, atraso] of lista) {
    const osc = ctx.createOscillator();
    const ganho = ctx.createGain();
    const t = t0 + atraso;
    osc.type = 'sine';
    osc.frequency.value = freq;
    // Envelope curto para a nota não estalar.
    ganho.gain.setValueAtTime(0.0001, t);
    ganho.gain.exponentialRampToValueAtTime(pico, t + 0.02);
    ganho.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(ganho).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.01);
  }
}

// tocar é o alerta de aguardando: dois bipes curtos subindo.
function tocar() {
  referencia = Date.now();
  notas([[880, 0], [1320, 0.18]], 0.3, 0.15);
}

// tocarFim é o alerta de fim de turno: duas notas descendentes, mais longas
// e mais baixas. Não mexe na referência do lembrete de aguardando.
function tocarFim() {
  notas([[660, 0], [440, 0.28]], 0.18, 0.25);
}

function atualizarSomBtn() {
  const bloqueado = somLigado && (!audio || audio.state !== 'running');
  somBtn.setAttribute('aria-pressed', String(somLigado));
  somBtn.classList.toggle('bloqueado', bloqueado);
  somBtn.title = !somLigado ? 'Som dos alertas: desligado'
    : bloqueado ? 'Som dos alertas: ligado — toque na página para liberar o som'
    : 'Som dos alertas: ligado';
  somBtn.replaceChildren(icone(somLigado ? 'somLigado' : 'somDesligado'));
}

// ---------- Silenciar um agente (silenciar-agente) ----------
// O silêncio vale só para a espera em curso e só nesta página. O som global
// continua mandando: desligado, nada toca de qualquer jeito.

// podeSilenciar: o controle aparece para quem está em aguardando no último
// snapshot do SSE (não no poll do pop-up) ou já está silenciado.
function podeSilenciar(chave) {
  return !!AudioCtx && (aguardandoAtual.has(chave) || silenciados.has(chave));
}

// podarSilenciados tira o silêncio de quem saiu de aguardando.
function podarSilenciados(chaves) {
  for (const k of silenciados) if (!chaves.has(k)) silenciados.delete(k);
}

// haAlertaAudivel: alguma chave em aguardando fora dos silenciados.
function haAlertaAudivel(chaves) {
  if (!chaves) return false;
  for (const k of chaves) if (!silenciados.has(k)) return true;
  return false;
}

// alternarSilencio: silencia só quem está em aguardando; desfazer vale sempre.
function alternarSilencio(chave) {
  if (silenciados.has(chave)) silenciados.delete(chave);
  else if (aguardandoAtual.has(chave)) silenciados.add(chave);
  else return;
  render(ultimoSnapshot);
  if (dlg.open) renderDetalhe();
}

// sinalSilencio resume o que os controles de silêncio do pop-up mostram para a
// sessão; se mudou entre snapshots, o pop-up é redesenhado.
function sinalSilencio(sid) {
  const doPopup = (k) => k === sid || k.startsWith(sid + '/');
  return [...aguardandoAtual].filter(doPopup).sort().join(',') + '|' +
    [...silenciados].filter(doPopup).sort().join(',');
}

function atualizarDetSilenciar() {
  const d = det.dados;
  det.sinalSom = d ? sinalSilencio(d.ID) : '';
  detSilenciar.hidden = !d || !podeSilenciar(d.ID);
  if (detSilenciar.hidden) return;
  const mudo = silenciados.has(d.ID);
  const nome = d.Name || d.Project || d.ShortID || d.ID;
  detSilenciar.setAttribute('aria-pressed', String(mudo));
  detSilenciar.replaceChildren(icone(mudo ? 'somDesligado' : 'somLigado'), el('span', null, mudo ? 'Reativar som' : 'Silenciar'));
  detSilenciar.setAttribute('aria-label', 'Silenciar o alerta de ' + nome);
  detSilenciar.title = (mudo ? 'Reativar o som do alerta de ' : 'Silenciar o alerta de ') + nome;
}

// chavesAguardando: "<sessão>" ou "<sessão>/<subagente>" para cada um em aguardando.
function chavesAguardando(sessoes) {
  const chaves = new Set();
  for (const s of sessoes) {
    if (s.Status === 'aguardando') chaves.add(s.ID);
    for (const a of s.Subagents || []) {
      if (a.Status === 'aguardando') chaves.add(s.ID + '/' + a.ID);
    }
  }
  return chaves;
}

const emTurno = (st) => st === 'ativo' || st === 'aguardando';

// fimDeTurno atualiza o início dos turnos e diz se alguma sessão passou de
// ativo para parado depois de um turno longo. Sem linha de base (antes
// null), só grava: quem está em turno começa a contar agora, mesmo que já
// tivesse um início, porque durante a queda o turno pode ter acabado e outro
// começado.
function fimDeTurno(sessoes, antes) {
  const agora = Date.now();
  const status = new Map();
  let fim = false;
  for (const s of sessoes) {
    status.set(s.ID, s.Status);
    if (emTurno(s.Status)) {
      if (!antes || !inicioTurno.has(s.ID)) inicioTurno.set(s.ID, agora);
      continue;
    }
    const inicio = inicioTurno.get(s.ID);
    inicioTurno.delete(s.ID);
    if (antes && antes.get(s.ID) === 'ativo' && s.Status === 'parado' &&
        inicio !== undefined && agora - inicio >= TURNO_MIN_MS) fim = true;
  }
  for (const id of inicioTurno.keys()) if (!status.has(id)) inicioTurno.delete(id);
  statusAntes = status;
  return fim;
}

// avaliarSom compara com o snapshot anterior: chave nova em aguardando toca
// uma vez (se não estiver silenciada); senão, um fim de turno longo toca o
// alerta de fim. O primeiro snapshot da conexão só vira linha de base.
function avaliarSom(sessoes, agora) {
  const antes = aguardandoAntes;
  aguardandoAntes = agora;
  const fim = fimDeTurno(sessoes, antes === null ? null : statusAntes);
  if (antes === null) {
    referencia = Date.now();
    return;
  }
  if (!somLigado) return;
  for (const k of agora) {
    if (!antes.has(k) && !silenciados.has(k)) {
      tocar();
      return;
    }
  }
  if (fim) tocarFim();
}

if (AudioCtx) {
  somLigado = lerSom();
  somBtn.hidden = false;
  if (somLigado) garantirAudio(); // provavelmente suspenso até o primeiro gesto
  atualizarSomBtn();

  somBtn.addEventListener('click', () => {
    somLigado = !somLigado;
    gravarSom(somLigado);
    if (somLigado) {
      const ctx = garantirAudio();
      // A confirmação espera o resume(), que dentro do clique é aceito.
      if (ctx) ctx.resume().then(tocar, () => {}).finally(atualizarSomBtn);
    }
    atualizarSomBtn();
  });

  // Som salvo como ligado: o primeiro gesto em qualquer ponto destrava o áudio.
  const destravar = () => { if (somLigado) garantirAudio(); };
  document.addEventListener('pointerdown', destravar);
  document.addEventListener('keydown', destravar);

  setInterval(() => {
    if (somLigado && haAlertaAudivel(aguardandoAntes) && Date.now() - referencia >= LEMBRETE_MS) {
      tocar();
    }
  }, 5000);
}

// conectado alterna o indicador do cabeçalho entre "ao vivo" e "reconectando…".
function conectado(ok, texto) {
  topo.classList.toggle('reconectando', !ok);
  conexao.textContent = ok ? 'ao vivo' : texto;
}

// SSE: cada "snapshot" traz a lista completa e substitui a grade.
const es = new EventSource('/stream');
es.addEventListener('open', () => {
  conectado(true);
  aguardandoAntes = null; // conexão nova: o próximo snapshot é a linha de base
});
es.addEventListener('snapshot', (e) => {
  conectado(true);
  let sessoes;
  try {
    sessoes = JSON.parse(e.data);
  } catch (_) {
    return; // snapshot corrompido: mantém a grade anterior
  }
  sessoes = Array.isArray(sessoes) ? sessoes : [];
  // Poda antes de desenhar: a marca de silenciado não atrasa um snapshot.
  const chaves = chavesAguardando(sessoes);
  aguardandoAtual = chaves;
  podarSilenciados(chaves);
  render(sessoes);
  avaliarSom(sessoes, chaves);
  if (dlg.open && det.dados && sinalSilencio(det.dados.ID) !== det.sinalSom) renderDetalhe();
});
es.addEventListener('uso', (e) => {
  let lista;
  try {
    lista = JSON.parse(e.data);
  } catch (_) {
    return; // uso corrompido: mantém os medidores anteriores
  }
  receberUso(lista, true);
});
es.addEventListener('error', () => {
  // CONNECTING: o navegador vai tentar de novo sozinho.
  // CLOSED: desistiu (ex.: 401 sem token); só recarregando.
  conectado(false, es.readyState === EventSource.CLOSED
    ? 'conexão perdida — recarregue a página'
    : 'reconectando…');
});

// Service worker: só por HTTPS, onde o navegador aceita registrar; por HTTP
// a página funciona igual, só não é instalável. Ele não guarda cache.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').then(iniciarPush, () => { /* sem SW, segue como página */ });
}

// ---------- Notificações push ----------
// O sino inscreve este aparelho no servidor, que avisa quando uma sessão
// entra em aguardando (e a cada 5 min enquanto ela seguir assim), mesmo com
// o app fechado. Cada aparelho liga o seu.

const pushBtn = document.getElementById('push');
let pushChave = '';      // chave pública VAPID do servidor (base64url)
let pushInscrito = false;
let pushFalhou = false;

function b64urlParaBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4);
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
}

function bytesParaB64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function enviarInscricao(sub) {
  const r = await fetch('/api/push/subscription', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sub),
  });
  if (!r.ok) throw new Error('servidor recusou a inscrição: ' + r.status);
}

async function apagarInscricao(sub) {
  await fetch('/api/push/subscription', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ endpoint: sub.endpoint }),
  });
}

function atualizarPushBtn() {
  const negado = Notification.permission === 'denied';
  pushBtn.setAttribute('aria-pressed', String(pushInscrito));
  pushBtn.classList.toggle('bloqueado', negado || pushFalhou);
  pushBtn.title = negado ? 'Notificações bloqueadas nas permissões do navegador'
    : pushFalhou ? 'Notificações: a última tentativa falhou; toque para tentar de novo'
    : pushInscrito ? 'Notificações neste aparelho: ligadas' : 'Notificações neste aparelho: desligadas';
  pushBtn.replaceChildren(icone(pushInscrito ? 'sino' : 'sinoCortado'));
}

// iniciarPush mostra o sino quando o navegador e o servidor suportam push, e
// reenvia a inscrição existente (o servidor pode ter perdido o arquivo). Uma
// inscrição feita com outra chave VAPID não recebe mais nada: é descartada.
async function iniciarPush() {
  if (!('PushManager' in window) || !('Notification' in window)) return;
  try {
    const r = await fetch('/api/push/key');
    if (!r.ok) return; // push desligado no servidor
    pushChave = (await r.json()).publicKey;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options.applicationServerKey && bytesParaB64url(sub.options.applicationServerKey) !== pushChave) {
      await sub.unsubscribe();
      sub = null;
    }
    pushInscrito = !!sub;
    if (sub) enviarInscricao(sub).catch(() => { pushFalhou = true; atualizarPushBtn(); });
  } catch (_) {
    return;
  }
  pushBtn.hidden = false;
  atualizarPushBtn();
}

if (pushBtn) {
  pushBtn.addEventListener('click', async () => {
    if (pushBtn.getAttribute('aria-busy') === 'true') return;
    pushBtn.setAttribute('aria-busy', 'true');
    try {
      if (pushInscrito) {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          await apagarInscricao(sub);
          await sub.unsubscribe();
        }
        pushInscrito = false;
      } else {
        // Primeiro a permissão, ainda dentro do gesto do toque.
        if (await Notification.requestPermission() !== 'granted') return;
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlParaBytes(pushChave) });
        try {
          await enviarInscricao(sub);
        } catch (e) {
          await sub.unsubscribe();
          throw e;
        }
        pushInscrito = true;
      }
      pushFalhou = false;
    } catch (_) {
      pushFalhou = true;
    } finally {
      pushBtn.removeAttribute('aria-busy');
      atualizarPushBtn();
    }
  });
}
</script>
</body>
</html>
