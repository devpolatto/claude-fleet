<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>Claude Fleet</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* Tema escuro por padrão: a página é feita para olhar no celular. */
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #141821;
    --surface-2: #1b202b;
    --border: #262c38;
    --text: #e9ecf2;
    --muted: #8e97a8;
    --faint: #5d6576;
    --ativo: #34d399;
    --ativo-glow: rgba(52, 211, 153, .5);
    --aguardando: #fbbf24;
    --aguardando-bg: #221a05;
    --aguardando-glow: rgba(251, 191, 36, .28);
    --parado: #8b93a1;
    --desconhecido: #a0a7b4;
    --concluido: #7c8798;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --tile-w: 160px;
    --toque-min: 28px;   /* menor alvo de toque (botão de silenciar subagente) */
    /* Conta do Claude Code (chip no pop-up e no filtro): fundo escuro + texto claro do mesmo
       tom, contraste AA (>= 7:1). A cor sai de hash(nome) % 4 + 1. */
    --conta-1: #1c2a4d;
    --conta-1-texto: #a9c2ff;
    --conta-2: #33224d;
    --conta-2-texto: #d4b8ff;
    --conta-3: #4a1e35;
    --conta-3-texto: #ffb3d1;
    --conta-4: #0f3a40;
    --conta-4-texto: #8ee6f0;
    --conta-outra: var(--surface-2);
    --conta-outra-texto: var(--desconhecido);
    /* Troca entre a tela de sessões e a de uso do plano. */
    --tela-transicao: .25s;
    /* Medidores do uso do plano: trilho, e o preenchimento muda de tom em 80% e 95%.
       --uso-critico mede 6,4:1 sobre --surface (AA para texto). */
    --uso-trilho: var(--border);
    --uso-ok: var(--ativo);
    --uso-alerta: var(--aguardando);
    --uso-critico: #f87171;
    --uso-barra-h: 10px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Cabeçalho ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 1;
    background: rgba(11, 13, 18, .92);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 14px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto;
    grid-template-areas: "marca push som vivo" "contador contador contador contador";
    align-items: center;
    gap: 12px;
    transition: background-color .3s;
  }
  header.reconectando { background: rgba(26, 21, 5, .95); }

  .marca { grid-area: marca; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .marca svg { flex: none; }
  h1 { font-size: 17px; margin: 0; font-weight: 700; white-space: nowrap; }

  #conexao {
    grid-area: vivo;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  #conexao::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ativo);
    box-shadow: 0 0 6px var(--ativo-glow);
  }
  header.reconectando #conexao { color: var(--aguardando); }
  header.reconectando #conexao::before { background: var(--aguardando); box-shadow: none; }

  /* Toggles do cabeçalho (som e notificações): âmbar quando ligados,
     tracejados quando o navegador bloqueia. */
  #push { grid-area: push; }
  #som { grid-area: som; }
  #som, #push {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--muted);
    cursor: pointer;
  }
  #som[hidden], #push[hidden] { display: none; }
  #som[aria-pressed="true"], #push[aria-pressed="true"] {
    border-color: rgba(251, 191, 36, .5);
    background: rgba(251, 191, 36, .14);
    color: var(--aguardando);
  }
  #som.bloqueado, #push.bloqueado { border-style: dashed; opacity: .7; }
  #som:focus-visible, #push:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #push[aria-busy="true"] { opacity: .6; cursor: progress; }

  /* Linha dos contadores + filtro de conta. O <select> fica fora do
     #contador, que é recriado a cada snapshot (não fecha nem perde o foco). */
  .resumo { grid-area: contador; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  #contador { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }
  .chip b { font-family: var(--mono); color: var(--text); font-weight: 700; }
  button.chip { border: 0; font: inherit; font-size: 13px; cursor: pointer; }
  button.chip:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .chip.ocultas[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--muted); color: var(--text); }
  .chip.alerta {
    background: rgba(251, 191, 36, .14);
    box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .5);
    color: var(--aguardando);
  }
  .chip.alerta b { color: var(--aguardando); }
  .chip.alerta::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--aguardando);
  }

  /* Filtro por conta: chip com <select> nativo (teclado e leitor de tela de
     graça); com uma conta escolhida, ganha a cor do chip dela. */
  .filtro-conta {
    position: relative;
    gap: 2px;
    padding: 0 0 0 10px;
    box-shadow: inset 0 0 0 1px var(--border);
    cursor: pointer;
  }
  .filtro-conta[hidden] { display: none; }
  .filtro-conta select {
    -webkit-appearance: none;
    appearance: none;
    min-width: 0;
    max-width: 16ch;
    margin: 0;
    padding: 5px 24px 5px 2px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-weight: 600;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .filtro-conta select:focus { outline: none; }
  .filtro-conta option { background: var(--surface); color: var(--text); }
  .filtro-conta::after {
    content: "";
    position: absolute;
    right: 11px;
    top: 50%;
    width: 5px;
    height: 5px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .filtro-conta:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
  .filtro-conta.filtrando { background: var(--conta-bg); box-shadow: none; color: var(--conta-fg); }
  .filtro-conta.filtrando select { color: var(--conta-fg); }

  /* ---------- Duas telas: sessões e uso do plano ----------
     As duas ocupam a mesma célula da grade e deslizam no eixo X. A tela de
     fora fica invisível e com altura zero só depois do deslize, para não
     esticar a rolagem da outra. touch-action: pan-y deixa a rolagem vertical
     com o navegador; o arrasto horizontal fica com o JS. */
  #telas {
    flex: 1 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
    overflow: hidden;
    touch-action: pan-y;
  }
  .tela {
    grid-area: 1 / 1;
    min-width: 0;
    transition: transform var(--tela-transicao) ease, visibility 0s;
  }
  #tela-uso { transform: translateX(100%); }
  #telas[data-tela="uso"] #tela-sessoes { transform: translateX(-100%); }
  #telas[data-tela="uso"] #tela-uso { transform: none; }
  #telas:not([data-tela="uso"]) #tela-uso,
  #telas[data-tela="uso"] #tela-sessoes {
    visibility: hidden;
    max-height: 0;
    overflow: hidden;
    transition: transform var(--tela-transicao) ease, visibility 0s var(--tela-transicao), max-height 0s var(--tela-transicao);
  }
  #telas.sem-transicao #tela-sessoes, #telas.sem-transicao #tela-uso { transition: none; }

  #tela-uso h2 { font-size: 17px; margin: 0; font-weight: 700; }

  /* ---------- Tela de uso: um bloco por conta, dois medidores cada ---------- */
  #uso-contas {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
    gap: 14px;
  }
  #uso-contas.uma { max-width: 720px; }
  .uso-conta {
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .uso-cab {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 12px;
    min-width: 0;
  }
  .uso-cab h3 { margin: 0; font-size: 14px; font-weight: 600; min-width: 0; }
  .uso-cab .conta {
    display: inline-block;
    max-width: 100%;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--conta-bg);
    color: var(--conta-fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  .uso-atualizado { margin-left: auto; font-size: 12px; color: var(--text); white-space: nowrap; }
  .uso-atualizado.velho { color: var(--muted); }
  .uso-sem-dado { margin: 0; color: var(--muted); }
  .uso-medidores {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
    gap: 16px 20px;
  }
  .medidor { --uso-cor: var(--uso-ok); min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .medidor.alerta { --uso-cor: var(--uso-alerta); }
  .medidor.critico { --uso-cor: var(--uso-critico); }
  .med-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .med-nome { color: var(--muted); font-size: 13px; }
  .med-pct {
    font-size: 30px;
    line-height: 1;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--uso-cor);
  }
  .med-barra {
    height: var(--uso-barra-h);
    border-radius: calc(var(--uso-barra-h) / 2);
    background: var(--uso-trilho);
    overflow: hidden;
  }
  .med-cheio {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--uso-cor);
  }
  .med-reset { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .medidor.reiniciada .med-barra { opacity: .45; }
  .medidor.reiniciada .med-estado { font-size: 13px; color: var(--muted); text-align: right; }

  /* Tokens e custo das janelas, somados dos transcripts (P2). Cache junta
     escrita e leitura numa coluna para caber em 360 px; o detalhe vai no title. */
  .uso-janelas { border-top: 1px solid var(--border); padding-top: 10px; min-width: 0; overflow-x: auto; }
  .uso-janelas table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .uso-janelas th, .uso-janelas td { padding: 3px 0 3px 10px; text-align: right; white-space: nowrap; }
  .uso-janelas th:first-child { padding-left: 0; text-align: left; }
  .uso-janelas thead th { color: var(--muted); font-size: 11px; font-weight: 600; }
  .uso-janelas tbody th { color: var(--muted); font-weight: 400; }
  .uso-janelas td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .uso-janelas td.zero { color: var(--faint); }
  .uso-janelas td.custo { color: var(--text); font-weight: 600; }
  .uso-janelas .legenda { margin-top: 4px; }

  /* ---------- Pontinhos: qual tela está aberta ---------- */
  #pontos {
    position: sticky;
    bottom: 0;
    z-index: 1;
    align-self: center;
    display: flex;
    gap: 2px;
    margin: 0 0 max(8px, env(safe-area-inset-bottom));
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  #pontos button {
    width: 32px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: none;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  #pontos button::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 4px;
    background: var(--faint);
    transition: width var(--tela-transicao) ease, background-color var(--tela-transicao);
  }
  #pontos button:hover::before { background: var(--muted); }
  #pontos button[aria-current="true"]::before { width: 20px; background: var(--text); }
  #pontos button:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }

  /* ---------- Grade centralizada ---------- */
  .tela {
    padding: 20px 16px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  #grade {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 8px;
  }

  #vazio { color: var(--muted); text-align: center; padding: 32px 8px; margin: 0; }
  #vazio[hidden] { display: none; }

  .nota { color: var(--faint); font-size: 11px; text-align: center; margin: 0; }

  /* ---------- Tile da sessão ---------- */
  .tile {
    position: relative;
    flex: none;
    width: var(--tile-w);
    max-width: 100%;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
    transition: transform .1s;
  }
  .tile:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .tile:active { transform: scale(.98); }
  /* Oculta exibida pelo chip "N oculta(s)": esmaecida e tracejada. */
  .tile.oculta { opacity: .55; border-style: dashed; }
  /* Marcas no canto do tile (oculta, alerta silenciado): lado a lado, nunca
     uma sobre a outra. */
  .tile .marcas {
    position: absolute;
    top: 10px;
    right: 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tile .marca-oculta { display: inline-flex; color: var(--faint); }
  .tile .marca-silenciada { display: inline-flex; color: var(--muted); }

  .tile .nome {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .linha {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
  }
  .tile .id {
    min-width: 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conta.c-1 { --conta-bg: var(--conta-1); --conta-fg: var(--conta-1-texto); }
  .conta.c-2 { --conta-bg: var(--conta-2); --conta-fg: var(--conta-2-texto); }
  .conta.c-3 { --conta-bg: var(--conta-3); --conta-fg: var(--conta-3-texto); }
  .conta.c-4 { --conta-bg: var(--conta-4); --conta-fg: var(--conta-4-texto); }
  .conta.c-outra { --conta-bg: var(--conta-outra); --conta-fg: var(--conta-outra-texto); }
  .det-sub .conta {
    padding: 0 6px;
    border-radius: 6px;
    background: var(--conta-bg);
    color: var(--conta-fg);
    font-weight: 600;
    white-space: nowrap;
  }
  .tile .custo {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .tile .custo.nd { color: var(--faint); }
  .tile .ferramenta {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    font-size: 12px;
    font-weight: 500;
  }
  .tile .ferramenta svg { flex: none; color: var(--muted); }
  .tile .ferramenta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .ferramenta.vazia { color: var(--faint); }
  .tile .ferramenta.vazia svg { color: var(--faint); }

  /* Etiqueta de status: ponto + rótulo; "aguardando" vira etiqueta sólida. */
  .status {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--parado);
  }
  .status::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .status.s-ativo { position: relative; color: var(--ativo); }
  .status.s-ativo::before { box-shadow: 0 0 6px var(--ativo-glow); }
  /* Anel que pulsa em volta do ponto verde. */
  .status.s-ativo::after {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-top: -4px;
    border-radius: 50%;
    box-shadow: 0 0 0 0 var(--ativo-glow);
    animation: pulso 1.6s ease-out infinite;
  }
  .status.s-desconhecido { color: var(--desconhecido); }
  .status.s-desconhecido::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
  .status.s-aguardando {
    padding: 3px 7px;
    border-radius: 999px;
    background: var(--aguardando);
    color: var(--aguardando-bg);
    letter-spacing: .02em;
  }
  .status.s-aguardando::before { display: none; }
  .status.s-concluido { padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .status.s-concluido::before { display: none; }

  @keyframes pulso {
    0%   { box-shadow: 0 0 0 0 var(--ativo-glow); }
    100% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
  }

  .aviso-sub {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--aguardando);
  }
  .aviso-sub svg { flex: none; }
  .aviso-sub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .aviso-sub { gap: 4px; font-size: 10px; }

  /* ativo: borda verde suave */
  .tile.s-ativo { border-color: rgba(52, 211, 153, .4); box-shadow: 0 0 14px rgba(52, 211, 153, .12); }

  /* aguardando: fundo âmbar, borda de 2 px e brilho; sem animação. */
  .tile.s-aguardando {
    background: var(--aguardando-bg);
    border: 2px solid var(--aguardando);
    padding: 11px;
    box-shadow: 0 0 18px var(--aguardando-glow);
  }

  /* subagente aguardando: o tile-pai ganha a mesma borda âmbar. */
  .tile.sub-aguardando:not(.s-aguardando) {
    border: 2px solid var(--aguardando);
    padding: 11px;
    box-shadow: 0 0 14px rgba(251, 191, 36, .18);
  }

  /* desconhecido: neutro, borda tracejada */
  .tile.s-desconhecido { background: var(--bg); border: 1.5px dashed rgba(160, 167, 180, .55); }

  /* encerrado: esmaecido */
  .tile.s-encerrado { opacity: .42; }

  /* ---------- Mini-tiles dos subagentes ---------- */
  .subs { display: flex; flex-wrap: wrap; gap: 4px; }
  .sub {
    min-width: 0;
    max-width: 100%;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 24px;
    padding: 3px 7px 3px 6px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    background: var(--surface-2);
    color: var(--muted);
  }
  .sub svg { flex: none; }
  .sub .tipo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub.s-ativo {
    background: rgba(52, 211, 153, .12);
    box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .35);
    color: var(--ativo);
  }
  .sub.s-ativo::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ativo);

  .sub.s-aguardando {

  /* ---------- Pop-up de detalhes ---------- */
  #detalhe {

  .det {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
    max-height: inherit;
  }
  .alca { display: none; }
  .det-topo {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 16px 12px;

  .det-sub { display: flex; gap: 8px; min-width: 0; font-size: 12px; color: var(--muted); font-weight: 500; }
  .det-sub .mono { color: var(--faint); font-weight: 400; }
  .fechar {
    flex: none;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }
  .fechar:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .det-acoes { display: flex; align-items: center; gap: 8px; flex: none; }
  .ocultar {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: var(--surface-2);

  .ocultar[hidden] { display: none; }
  .ocultar:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  /* Silenciar ligado: o botão fica em destaque para lembrar do agente mudo. */

  .silenciar-sub {

  .det-corpo {

  /* Na coluna com rolagem, nenhum bloco encolhe: quem rola é o contêiner. */

  .det-rodape {

  .det h3 {
    font-size: 11px;

  .aviso {

  .cwd {
    margin: 2px 0 0;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .custo-box { padding: 14px; border-radius: 12px; background: var(--surface-2); }
  .custo-box .linha { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .custo-total { margin: 0; font-family: var(--mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .custo-box .rot { color: var(--muted); font-size: 11px; font-weight: 500; }
  .rotulo-estimativa { color: var(--faint); font-size: 11px; margin: 2px 0 0; }

  .metricas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .metrica { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
  .metrica .k { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; color: var(--muted); }
  .metrica .k.vivo::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ativo);
    box-shadow: 0 0 5px var(--ativo-glow);
  }
  .metrica .v {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .metrica .v.txt { font-family: inherit; }

  /* Tabela: uma linha por agente e uma coluna por categoria; cabe em 360 px. */
  .tabela-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-color: var(--border) transparent;
  }
  .tokens { border-collapse: collapse; width: 100%; font-size: 10.5px; }
  .tokens th, .tokens td { padding: 8px 6px; text-align: right; white-space: nowrap; }
  .tokens th:first-child, .tokens td:first-child { padding-left: 10px; }
  .tokens th:last-child, .tokens td:last-child { padding-right: 10px; }
  .tokens thead th { color: var(--muted); font-size: 10px; font-weight: 600; background: var(--surface-2); }

  .tokens tbody tr { border-top: 1px solid var(--border); }

    overflow: hidden;
    text-overflow: ellipsis;

  .tokens.por-modelo tbody th { max-width: 110px; font-family: var(--mono); }
  .tokens td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tokens td.zero { color: var(--faint); }

  .tokens tr.foco th { color: var(--aguardando); }
  .legenda { margin: 6px 0 0; color: var(--faint); font-size: 10px; }

  .agentes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .agente {

  .agente .cab-dir { flex: none; display: inline-flex; align-items: center; gap: 6px; }
  .agente .titulo { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .agente .tipo { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agente .subtipo { flex: none; font-size: 11px; color: var(--muted); }
  .agente .em-foco {
    flex: none;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(251, 191, 36, .18);
    color: var(--aguardando);
    font-size: 10px;
